# iOS CI：XcodeGen 生成工程 → iPhone 16 模拟器跑纯逻辑单测
# 任务卡：T01。注意：本目录（ios/）将来整体作为独立 git 仓库根，
# 届时本文件位于仓库的 .github/workflows/ 才会被 GitHub 识别。
name: ios-ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Show toolchain
        run: |
          xcodebuild -version
          sw_vers

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Assert Core layer never imports Photos (T02 red line)
        run: |
          # 只匹配行首真正的 import 语句——Core 层注释里含"import Photos"字样属正当文档，不许误伤。
          # 显式区分退出码：0=违规；2+=目录缺失等检查自身故障也按失败处理（fail-closed，
          # 防止路径变动后红线检查在全绿掩护下静默失效）。注意步骤默认 bash -eo pipefail，
          # 裸 grep 的 rc=1（干净）会触发 errexit，故用 || 接住退出码。
          rc=0
          grep -rnE '^[[:space:]]*import[[:space:]]+Photos[[:space:]]*$' Sources/Core/ || rc=$?
          if [ "$rc" -eq 0 ]; then
            echo "::error::Sources/Core/ 出现 import Photos，违反架构红线"
            exit 1
          elif [ "$rc" -ge 2 ]; then
            echo "::error::红线检查自身失败（grep rc=$rc），按违规处理"
            exit 1
          fi
          echo "Core layer clean: no PhotoKit imports"

      - name: Assert SafetyRules.validateRedLines is wired at launch (T09)
        run: |
          # 存在性检查：启动路径必须调用红线断言（任务卡 T09 验收）
          grep -q "SafetyRules.validateRedLines()" Sources/AppRoot.swift || {
            echo "::error::App 启动路径缺少 SafetyRules.validateRedLines() 调用"
            exit 1
          }
          echo "launch-time red-line check wired"

      - name: List available simulators (debug aid)
        run: xcrun simctl list devices available | head -n 30

      - name: Run unit tests (iPhone 16 simulator)
        run: |
          if xcodebuild test \
            -project AIPhotoInbox.xcodeproj \
            -scheme AIPhotoInbox \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            > /tmp/xcodebuild.log 2>&1; then
            echo "ALL TESTS PASSED"
            # 每个测试套件汇总成一条 ::notice:: 注解（匿名可读核实用例数；
            # GitHub 每步注解上限 10 条，故一行打包一个套件名与其用例数）
            awk '/Test Suite .*Tests. passed/ {pending=$0}
                 /Executed [0-9]+ tests,/ {
                   if (pending != "") {
                     gsub(/.*Test Suite ./, "", pending)
                     gsub(/. passed.*/, "", pending)
                     line=$0
                     gsub(/^[ \t]+/, "", line)
                     print pending ": " line
                     pending=""
                   }
                 }' /tmp/xcodebuild.log | while IFS= read -r line; do
              echo "::notice::$line"
            done
          else
            echo "=== xcodebuild FAILED; extracted errors below ==="
            # 把错误行转成 ::error:: 注解，公开仓库下匿名可读，便于无凭据排障
            grep -E "error:|fatal error:|Testing failed:|Failing tests:" /tmp/xcodebuild.log \
              | sort -u | head -30 | while IFS= read -r line; do
                echo "::error::$line"
              done
            tail -80 /tmp/xcodebuild.log
            exit 1
          fi

  # 免签名设备构建：产出 Payload zip（下载后改名 .ipa 喂 Sideloadly）。
  # 免费签名路线不需要开发者账号；签名动作在用户本机的 Sideloadly 完成。
  device-build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned device app (Release / iphoneos)
        run: |
          xcodebuild \
            -project AIPhotoInbox.xcodeproj \
            -scheme AIPhotoInbox \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Verify compiled app icon metadata
        run: |
          APP="build/Build/Products/Release-iphoneos/AIPhotoInbox.app"
          test -d "$APP"
          test -s "$APP/Assets.car"
          ICON_NAME=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIconName" "$APP/Info.plist")
          test "$ICON_NAME" = "AppIcon"
          echo "AppIcon compiled: Assets.car present, CFBundleIconName=$ICON_NAME"

      - name: Package Payload zip
        run: |
          mkdir -p Payload
          cp -R "build/Build/Products/Release-iphoneos/AIPhotoInbox.app" Payload/
          zip -qr AIPhotoInbox-unsigned.zip Payload
          unzip -l AIPhotoInbox-unsigned.zip | head -20

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AIPhotoInbox-unsigned
          path: AIPhotoInbox-unsigned.zip
          retention-days: 14
